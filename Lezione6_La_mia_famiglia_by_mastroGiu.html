<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La mia famiglia – by mastroGiu</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#183b35;font:18px system-ui}header{background:#205c50;color:white;padding:25px;text-align:center}header h1{margin:8px;font-size:clamp(28px,5vw,46px)}main{max-width:900px;margin:24px auto;padding:16px}article{background:white;border:1px solid #d5e4dc;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 24px #1232}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #b9d1c5;background:#fff;color:#164b40;border-radius:12px;padding:13px 20px;margin:5px;font-weight:650}button:hover{background:#e5f3ec}button:disabled{cursor:default;opacity:.65}.primary{background:#205c50;color:white}.primary:hover{background:#17483e}.choices button{display:block;width:100%;text-align:left;margin:10px 0}.good{background:#d9f4df!important}.bad{background:#ffe5df!important}progress{width:100%;height:14px;accent-color:#27856a}small{color:#59766e}#feedback{min-height:48px;margin:18px 0}input,textarea{width:100%;padding:14px;border:1px solid #a6bcb3;border-radius:10px}details{background:#eef6f1;padding:14px;border-radius:12px;margin:15px 0}summary{cursor:pointer;font-weight:bold}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#edf5ee;border-radius:14px;padding:16px}.tree{text-align:center;background:#f2f6ef;padding:14px;border-radius:12px;line-height:2}.clock{display:block;margin:auto;width:220px;max-width:100%}footer{text-align:center;color:#59766e;padding:20px}button:focus-visible,input:focus-visible{outline:3px solid #e8a23d}h2{margin-top:0}</style><header><div>ITALIANO IN AZIONE! · 6° INCONTRO</div><h1>La mia famiglia</h1><div>Parole, persone e orari · by mastroGiu</div></header><main><article id="app"></article></main><footer>Italiano L2 · Imparare giocando · by mastroGiu</footer><script>const stages=[["La mia famiglia", "👨‍👩‍👧‍👦", [["q", "Quante persone ci sono nella famiglia di John (John, genitori, fratello e sorelle)?", ["Cinque", "Sei", "Sette"], "Sei", "John, due genitori, due sorelle e un fratello."], ["q", "Come si chiama la mamma di John?", ["Sandra", "Rose", "Julie"], "Sandra", "Sandra è la mamma."], ["q", "Dove abita Julie?", ["Oxford", "Roma", "Londra"], "Londra", "Julie abita a Londra."], ["q", "Quando è il compleanno di Rose?", ["13 febbraio", "18 settembre", "13 marzo"], "13 febbraio", "Rose compie gli anni il 13 febbraio."], ["q", "Quanti anni ha James?", ["Cinque", "Sette", "Dieci"], "Sette", "James ha sette anni."]]], ["L’albero genealogico", "🌳", [["q", "Giorgio è il ___ di Anna.", ["fratello", "padre", "nonno"], "fratello", "Giorgio e Anna sono fratelli."], ["q", "Gino e Rosa sono i ___ di Giorgio.", ["cugini", "nonni", "genitori"], "nonni", "Sono i suoi nonni."], ["q", "Mario è il ___ di Giorgio.", ["cugino", "zio", "papà"], "cugino", "Mario è il figlio dello zio Carlo."], ["q", "Carlo è lo ___ di Anna.", ["zio", "sorella", "nonna"], "zio", "Carlo è il fratello della mamma."], ["q", "Valentina e Nicola sono i genitori di Anna.", ["Vero", "Falso"], "Vero", "Valentina è la mamma e Nicola è il papà."]]], ["I possessivi", "✏️", [["fill", "Io ho una sorella. È ___ sorella.", [], "mia", "Mia sorella: normalmente senza articolo."], ["fill", "Tu hai un fratello. È ___ fratello.", [], "tuo", "Tuo fratello."], ["q", "John ha due sorelle. Sono le ___ sorelle.", ["sua", "sue", "suoi"], "sue", "Sorelle è femminile plurale."], ["q", "Noi abbiamo un cane. È il ___ cane.", ["nostro", "nostra", "vostro"], "nostro", "Cane è maschile singolare."], ["order", "Metti in ordine le parole.", ["mio", "Questo", "papà", "è"], "Questo è mio papà", "Questo è mio papà."]]], ["C’è / Ci sono", "🏠", [["q", "📚 Sul tavolo ___ tre libri.", ["c’è", "ci sono"], "ci sono", "Tre libri: plurale."], ["q", "🐈 In casa ___ un gatto.", ["c’è", "ci sono"], "c’è", "Un gatto: singolare."], ["q", "In classe non ___ computer. (plurale)", ["c’è", "ci sono"], "ci sono", "Computer può essere plurale."], ["fill", "Nel mio zaino ___ una penna.", [], "c’è", "Una penna: singolare."], ["order", "Metti in ordine le parole.", ["due", "Ci", "bambini", "sono"], "Ci sono due bambini", "Ci sono due bambini."]]], ["Che ore sono?", "🕒", [["clock", "Che ore sono?", ["Sono le tre", "Sono le sei", "Sono le nove"], "Sono le tre", "Le tre in punto.", 3, 0], ["clock", "Che ore sono?", ["Sono le otto e mezza", "Sono le otto e un quarto", "Sono le nove"], "Sono le otto e mezza", "8:30.", 8, 30], ["clock", "Che ore sono?", ["Sono le dieci e mezza", "Sono le dieci e un quarto", "Sono le undici"], "Sono le dieci e un quarto", "10:15.", 10, 15], ["clock", "Che ore sono?", ["Sono le nove e un quarto", "Sono le dieci meno un quarto", "Sono le dieci e mezza"], "Sono le dieci meno un quarto", "9:45.", 9, 45], ["q", "Come si dice 13:00?", ["È l’una del pomeriggio", "È mezzanotte", "Sono le due"], "È l’una del pomeriggio", "13:00 = l’una del pomeriggio."]]], ["Il suono SC", "🔊", [["sound", "Ascolta: sciarpa. Quale suono senti?", ["Dolce", "Duro"], "Dolce", "SCI ha suono dolce."], ["sound", "Ascolta: scuola. Quale suono senti?", ["Dolce", "Duro"], "Duro", "SCU ha suono duro."], ["q", "Quale parola ha il suono dolce?", ["pesce", "scarpa", "schiena"], "pesce", "SCE ha suono dolce."], ["q", "Quale parola ha il suono duro?", ["scimmia", "scena", "scheda"], "scheda", "SCHE ha suono duro."], ["fill", "Completa: ___arpa (si indossa al collo).", [], "sci", "SCI + ARPA = SCIARPA."]]]];let s=0,i=0,score=0,locked=false,order=[],history=[];const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis' in window)){alert('Lettura vocale non disponibile.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.8;speechSynthesis.speak(u)}const dialog='Anna: Da quante persone è composta la tua famiglia? John: Siamo in sei: io, mio papà Mark, mia mamma Sandra, le mie sorelle Julie e Rose e mio fratello Michael. Julie abita a Londra con David. Il compleanno di Julie è il 18 settembre. Rose compie gli anni il 13 febbraio. Julie e David hanno due figli: Olivia ha cinque anni e James ha sette anni.';function home(){app.innerHTML='<h2>Sei pronto per la sfida?</h2><p>Completa 30 attività in 6 tappe. Leggi, ascolta, scegli, scrivi e metti in ordine le parole. Non c’è un limite di tempo.</p><div class="tiles">'+stages.map((x,j)=>'<div class="tile">'+x[1]+' <b>'+ (j+1)+'. '+x[0]+'</b><br><small>5 attività</small></div>').join('')+'</div><p><button class="primary" onclick="start()">Inizia la missione →</button></p>'}function start(){s=i=score=0;history=[];render()}function clock(h,m){let nums='';for(let n=1;n<=12;n++){let a=n*Math.PI/6;nums+=`<text x="${110+82*Math.sin(a)}" y="${110-82*Math.cos(a)+5}" text-anchor="middle" font-size="16">${n}</text>`}return `<svg class="clock" viewBox="0 0 220 220" role="img" aria-label="Orologio analogico"><circle cx="110" cy="110" r="105" fill="#fff" stroke="#e9a23c" stroke-width="7"/>${nums}<path d="M110 110 L110 57" stroke="#205c50" stroke-width="7" stroke-linecap="round" transform="rotate(${h*30+m*.5} 110 110)"/><path d="M110 110 L110 34" stroke="#d76b25" stroke-width="4" stroke-linecap="round" transform="rotate(${m*6} 110 110)"/><circle cx="110" cy="110" r="5" fill="#205c50"/></svg>`}function render(){locked=false;order=[];let [name,emoji,qs]=stages[s],q=qs[i];let help=s===0?`<details open><summary>Leggi il dialogo</summary><p>${dialog}</p><button id="dialog">Ascolta il dialogo</button></details>`:s===1?'<details open><summary>Osserva la famiglia di Giorgio</summary><div class="tree"><b>Gino + Rosa</b><br>↓<br>Carlo + Francesca　 |　 Valentina + Nicola<br>↓　　　　　　　　　↓<br>Mario　　　　　 Giorgio e Anna</div></details>':'';app.innerHTML=`<small>Tappa ${s+1}/6 · Domanda ${s*5+i+1}/30 · Punti ${score}</small><progress max="30" value="${s*5+i}"></progress><h2>${emoji} ${name}</h2>${help}<h3>${esc(q[1])}</h3><button id="listen">🔊 Ascolta</button>${q[0]==='clock'?clock(q[5],q[6]):''}<div id="answers" class="choices"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden>Continua →</button>`;document.getElementById('listen').onclick=()=>speak(q[0]==='sound'?q[1].split(': ')[1].split('.')[0]:q[1]);if(s===0)document.getElementById('dialog').onclick=()=>speak(dialog);let a=document.getElementById('answers');if(q[0]==='fill'){a.innerHTML='<input id="entry" autocomplete="off" placeholder="Scrivi la risposta"><button id="check">Controlla</button>';document.getElementById('check').onclick=()=>check(document.getElementById('entry').value);document.getElementById('entry').onkeydown=e=>{if(e.key==='Enter')check(e.target.value)}}else if(q[0]==='order'){a.className='';let line=document.createElement('p');line.textContent='La tua frase: …';a.append(line);q[2].forEach(w=>{let b=document.createElement('button');b.textContent=w;b.onclick=()=>{order.push(w);b.disabled=true;line.textContent='La tua frase: '+order.join(' ')};a.append(b)});let reset=document.createElement('button');reset.textContent='Ricomincia la frase';reset.onclick=()=>render();a.append(reset);let b=document.createElement('button');b.textContent='Controlla';b.onclick=()=>check(order.join(' '));a.append(b)}else{q[2].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>check(v,b);a.append(b)})}document.getElementById('next').onclick=()=>{i++;if(i===5){s++;i=0}if(s===6)finish();else render()}}function norm(v){return v.trim().toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ').replace(/[.!?]$/,'')}function check(v,b){if(locked||!v.trim())return;locked=true;let q=stages[s][2][i],ok=norm(v)===norm(q[3]);if(ok)score++;history.push([q[1],ok,q[3]]);if(b)b.classList.add(ok?'good':'bad');document.querySelectorAll('#answers button,#answers input').forEach(x=>x.disabled=true);document.getElementById('feedback').innerHTML=`<b>${ok?'✓ Bravo!':'Riproviamo a ricordare: '+esc(q[3])}</b><br>${esc(q[4])}`;document.getElementById('next').hidden=false}function finish(){app.innerHTML=`<h2>🏆 Missione completata!</h2><h1>${score} / 30</h1><p>Hai completato tutte le tappe!</p><h3>Sfida finale: scrivi 3–5 frasi</h3><p>Descrivi una famiglia reale o inventata. Usa un possessivo, c’è o ci sono e un orario.</p><p><small>Esempio: Mia sorella si chiama Anna. In casa ci sono due gatti. Alle otto vado a scuola.</small></p><textarea id="story" rows="5" placeholder="Scrivi qui..."></textarea><button onclick="speak(document.getElementById('story').value)">Ascolta il tuo testo</button><button onclick="copyStory()">Copia il testo</button><p id="status" role="status"></p><details><summary>Rivedi le risposte da ripassare</summary>${history.filter(x=>!x[1]).map(x=>'<p>'+esc(x[0])+'<br><b>'+esc(x[2])+'</b></p>').join('')||'Tutte corrette!'}</details><button class="primary" onclick="start()">Gioca ancora</button>`}async function copyStory(){let t=document.getElementById('story');try{await navigator.clipboard.writeText(t.value);document.getElementById('status').textContent='Testo copiato.'}catch{t.select();document.getElementById('status').textContent='Premi Ctrl+C per copiare.'}}home();</script></html>
