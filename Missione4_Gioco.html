let level=0,idx=0,score=0,total=levels.reduce((s,l)=>s+l.qs.filter(q=>q.type!=='free').length,0),selected=null,checked=false,freeAnswers=[];const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function start(){level=0;idx=0;score=0;freeAnswers=[];render()}
function render(){if(level>=levels.length)return finish();const l=levels[level],q=l.qs[idx],n=levels.slice(0,level).reduce((s,x)=>s+x.qs.length,0)+idx,all=levels.reduce((s,x)=>s+x.qs.length,0);selected=null;checked=false;app.innerHTML=`<div class="panel"><span class="tag">Tappa ${level+1} di ${levels.length}</span><div class="progress"><div class="bar" style="width:${Math.round(n/all*100)}%"></div></div><h2>${esc(l.title)}</h2><p class="muted">${esc(l.desc)}</p>${l.intro?`<div class="context">${esc(l.intro)}</div>`:''}<div class="q">${idx+1}. ${esc(q.q)}</div><div id="choices">${q.a?`<div class="options">${q.a.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join('')}</div>`:`<input id="written" class="textanswer" maxlength="250" autocomplete="off" placeholder="Scrivi qui la tua risposta…" aria-label="La tua risposta">`}</div><div id="feedback" aria-live="polite"></div><button class="action" id="check" disabled>${q.type==='free'?'Salva la frase':'Controlla la risposta'}</button><button class="action secondary" id="next" style="display:none">${idx===l.qs.length-1?(level===levels.length-1?'Vedi il risultato':'Prossima tappa'):'Continua'}</button></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(checked)return;selected=Number(b.dataset.i);document.querySelectorAll('.opt').forEach(z=>z.classList.toggle('sel',z===b));document.getElementById('check').disabled=false});const inp=document.getElementById('written');if(inp)inp.oninput=()=>document.getElementById('check').disabled=!inp.value.trim();document.getElementById('check').onclick=check;document.getElementById('next').onclick=()=>{idx++;if(idx>=l.qs.length){idx=0;level++}render()}}
function normalize(s){return s.trim().toLocaleLowerCase('it').replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function check(){if(checked)return;const q=levels[level].qs[idx],inp=document.getElementById('written'),val=inp?inp.value.trim():null;let ok=false;if(q.type==='free'){freeAnswers.push({question:q.q,answer:val});}else if(q.type==='text'){ok=q.answers.some(x=>normalize(x)===normalize(val));}else ok=selected===q.c;if(ok)score++;checked=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(inp)inp.disabled=true;const msg=q.type==='free'?`Frase registrata! Confrontala con questo esempio: ${q.sample} La tua frase sarà da controllare con il professore.`:ok?'Bravo! Risposta corretta.':`Riprova a ricordare: ${q.type==='text'?q.answers[0]:q.a[q.c]}. ${q.why||''}`;document.getElementById('feedback').innerHTML=`<div class="feedback ${ok||q.type==='free'?'good':'bad'}">${esc(msg)}</div>`;document.getElementById('check').style.display='none';document.getElementById('next').style.display='inline-block'}
function finish(){const pct=Math.round(score/total*100);app.innerHTML=`<div class="panel"><span class="tag">Percorso completato</span><h2>Complimenti! Hai terminato le 6 tappe.</h2><p style="font-size:23px"><strong>${score} / ${total}</strong> risposte corrette (${pct}%).</p><p>${pct>=85?'Ottimo lavoro!':pct>=60?'Buon lavoro! Puoi migliorare ancora.':'Hai imparato cose nuove: riprova e vedrai i progressi!'}</p><p>Le due frasi libere non sono comprese nel punteggio: rileggile insieme al professore.</p>${freeAnswers.length?`<h3>Le tue frasi</h3>${freeAnswers.map(x=>`<p><strong>${esc(x.question)}</strong><br>${esc(x.answer)}</p>`).join('')}`:''}<p class="muted">Puoi mostrare questa schermata al professore o fare uno screenshot per Classroom. Il gioco non invia dati automaticamente.</p><button class="action" onclick="start()">Ricomincia il gioco</button><button class="action secondary" onclick="window.print()">Stampa risultato</button></div>`}start();
